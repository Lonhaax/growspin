version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gambling_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 759a2d7bc948c40ce1fe17577b3f1729
      MYSQL_DATABASE: gambling
      MYSQL_USER: gambling_user
      MYSQL_PASSWORD: f3f2b3dfcacbea3e0aa20e822b4421d1
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: 
      context: ./backend
    container_name: gambling_backend
    restart: always
    command: sh -c "npx prisma db push && npm start"
    expose:
      - "3001"
    environment:
      - DATABASE_URL=mysql://gambling_user:f3f2b3dfcacbea3e0aa20e822b4421d1@db:3306/gambling
      - JWT_ACCESS_SECRET=f71d68a2e0bbec1b48cb4de5478469c7757d9d336c2258329d5db4083bb74eb4
      - JWT_REFRESH_SECRET=904b431a76f0170ca3c387603ee2b03134f4c3fda6f08dac1d1b0bd4ad8163d4
      - DISCORD_WEBHOOK_URL=
      - NOWPAYMENTS_API_KEY=your_api_key_here
      - NOWPAYMENTS_IPN_SECRET=your_ipn_secret_here
      - NODE_ENV=production
      - FRONTEND_URL=https://growspin.lol
    depends_on:
      - db

  deposit_bot:
    build: 
      context: ./backend
    container_name: gambling_deposit_bot
    restart: always
    command: node bot/deposit_bot.mjs
    environment:
      - BACKEND_URL=http://backend:3001
      - GROWTOPIA_BOT_USERNAME=GrowSpinBot
      - GROWTOPIA_BOT_PASSWORD=growspinpass
      - GROWTOPIA_BOT_SECRET=GROWTOPIA_BOT_SECRET_2026
    depends_on:
      - backend

  frontend:
    build: 
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://api.growspin.lol
    container_name: gambling_frontend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend

  proxy:
    image: caddy:2-alpine
    container_name: gambling_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
  caddy_data:
