version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: gambling_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: gambling
      MYSQL_USER: gambling_user
      MYSQL_PASSWORD: user_password_here
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build: 
      context: ./backend
    container_name: gambling_backend
    restart: always
    expose:
      - "3001"
    environment:
      - DATABASE_URL=mysql://gambling_user:user_password_here@db:3306/gambling
      - JWT_SECRET=your_super_secret_jwt_key_here
      - NODE_ENV=production
    depends_on:
      - db

  frontend:
    build: 
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=https://api.growspin.lol
    container_name: gambling_frontend
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - BACKEND_URL=http://backend:3001
    depends_on:
      - backend

  proxy:
    image: nginx:alpine
    container_name: gambling_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  db_data:
